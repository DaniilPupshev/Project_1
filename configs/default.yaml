project:
  # Название проекта
  name: PechVision

  # Часовой пояс - используется в OCR
  timezone: Europe/Moscow


database:
  # Строка подключения к PostgreSQL.
  # Формат: postgresql+psycopg://user:password@host:port/database
  url: postgresql+psycopg://pechvision:pechvision@localhost:5432/pechvision


paths:
  # Папка с исходными видеофайлами
  videos_dir: data/input/videos

  # Папка с файлами чеков CSV/Excel
  receipts_dir: data/input/orders

  # Папка для сохраненных изображений лиц
  faces_dir: data/output/faces

  # Папка для итоговых отчетов CSV/XLSX.
  reports_dir: data/output/reports

  # Папка для промежуточных результатов обработки
  runs_dir: data/output/runs

  # Папка с локальными ML-моделями
  models_dir: data/models

  # Папка с CSV-справочником и эталонными фото кассиров
  cashiers_dir: data/cashiers


video:
  # Шаг обработки кадров: 3 означает анализировать каждый третий кадр
  frame_step: 3

  # Минимальное время нахождения в зоне кассы, чтобы считать событие визитом
  min_visit_seconds: 15

  # Поддерживаемые расширения видеофайлов
  supported_extensions:
    - .mp4
    - .avi
    - .mov


processing:
  # Интервал анализа кадров в активном режиме, в секундах медиавремени
  active_interval_seconds: 0.12

  # Интервал проверки кадров в режиме простоя; в 10 раз реже активного режима
  idle_interval_seconds: 1.2

  # Через сколько секунд без людей включать режим простоя
  idle_after_seconds: 30.0

  # На сколько секунд возвращаться назад после обнаружения человека в простое
  wakeup_rewind_seconds: 2.0


ocr:
  # Включает или отключает OCR времени с изображения видео
  enabled: true

  # Формат даты и времени, который ожидается после OCR
  # Пример на видео: 06-22-2026 Mon 10:01:58
  datetime_format: "%m-%d-%Y %a %H:%M:%S"

  # Область кадра, где находится дата и время
  crop:
    # X-координата левого верхнего угла OCR-области
    x: 0

    # Y-координата левого верхнего угла OCR-области
    y: 10

    # Ширина OCR-области в пикселях
    width: 550

    # Высота OCR-области в пикселях
    height: 100

timeline:
  # Позиции от начала видео, на которых выполняются попытки OCR
  anchor_search_offsets_seconds:
    - 0
    - 2
    - 5
    - 10
    - 20
    - 30

  # Минимальное количество согласованных результатов OCR
  minimum_consistent_anchors: 2

  # Допустимое расхождение рассчитанного времени начала видео
  anchor_consistency_tolerance_seconds: 2.0

  # Позиции перед концом видео для независимой проверки временной шкалы
  end_validation_offsets_before_end_seconds:
    - 30
    - 10
    - 2

  # Минимальное количество согласованных OCR-результатов около конца
  minimum_consistent_end_anchors: 2

  # Максимально допустимое расхождение начала по стартовому и конечному OCR
  end_validation_tolerance_seconds: 2.0

  # Максимальный дрейф за видео, который можно исправить линейной калибровкой
  max_end_calibration_seconds: 10.0


cashier_zone:
  # Правило определения положения человека относительно зоны
  # bottom_center означает нижняя центральная точка bbox человека
  point_policy: bottom_center

  # Полигон зоны кассы в координатах кадра
  # Формат каждой точки: [x, y]
  polygon:
    - [350, 0]
    - [1450, 0]
    - [1450, 1080]
    - [350, 1080]


detection:
  # Путь к локальной модели детекции людей
  model_path: data/models/yolo/yolo11n.pt

  # Устройство YOLO: auto выбирает Apple GPU при доступности, иначе CPU
  device: auto

  # Минимальная уверенность детекции человека
  confidence_threshold: 0.45

  # IoU-порог для удаления дублирующихся bbox
  iou_threshold: 0.5

  # ID класса человека в COCO/YOLO
  person_class_id: 0


tracking:
  # Тип трекера для связывания людей между кадрами
  tracker_type: bytetrack

  # Сколько секунд человек может пропадать из кадра без создания нового визита
  max_missing_seconds: 90


visit_sessions:
  # Максимальный разрыв между фрагментами одной персоны
  merge_timeout_seconds: 90


faces:
  # Набор моделей InsightFace для детекции лиц, embeddings и базовых атрибутов
  model_name: buffalo_l

  # Локальная папка, где InsightFace хранит/ищет модели
  model_root: data/models/insightface

  # Провайдеры ONNX Runtime. CPUExecutionProvider работает локально на Mac без GPU
  providers:
    - CPUExecutionProvider

  # Размер входа детектора лиц InsightFace
  det_size: [640, 640]

  # Минимальная уверенность детекции лица
  det_threshold: 0.65

  # Порог похожести лиц для распознавания одного и того же человека
  recognition_threshold: 0.35

  # Сколько ближайших персон учитывать при идентификации
  identity_candidate_limit: 5

  # Минимальный отрыв лучшего кандидата от второго
  identity_ambiguity_margin: 0.05

  # Минимальный размер лица в пикселях; для верхней камеры лица часто маленькие
  min_face_size: 70

  # Минимальная резкость лица для использования в идентификации
  min_identity_sharpness: 40.0

  # Минимальная уверенность детектора для эталонного лица
  min_identity_confidence: 0.75

  # Допустимое расстояние bbox лица от края исходного кадра в пикселях
  identity_frame_margin: 3

  # Максимальное yaw-отклонение
  max_identity_yaw: 40.0

  # Максимальное pitch-отклонение
  max_identity_pitch: 30.0

  # Максимальное roll-отклонение
  max_identity_roll: 30.0

  # Максимальное количество эталонных лиц одной персоны
  max_identity_references_per_person: 5

  # Максимальное количество эталонов одного ракурса
  max_identity_references_per_pose: 2

  # Максимальный yaw для категории frontal
  identity_frontal_yaw_threshold: 15.0

  # Как часто искать лица в основном pipeline: 1 = каждый обработанный кадр
  search_every_processed_frames: 10

  # Если true, сохраняется лучший кадр лица для каждого визита/трека
  save_best_face: true

demographics:
  # Включает определение пола и примерного возраста
  enabled: true

  # Провайдер анализа пола и возраста
  provider: insightface

  # Размер возрастной группы. 10 означает 20-29, 30-39 и так далее
  age_bucket_size: 10


cashiers:
  # Включает исключение кассиров из посетителей
  enabled: false

  # CSV-справочник сотрудников
  registry_path: data/cashiers/name_cashiers.csv

  # Поддерживаемые расширения эталонных фотографий
  supported_extensions:
    - .png
    - .jpg
    - .jpeg

  # Порог похожести лица с кассиром для исключения.
  # Перед применением к данным его нужно проверить через classify-staff без --apply
  similarity_threshold: 0.5


receipts:
  # Название колонки с временем закрытия/оплаты чека
  time_column: dl_tm

  # Название колонки с временем открытия заказа
  open_time_column: openTime

  # Название колонки с уникальным ID чека
  id_column: OrderId

  # Название колонки с суммой чека
  amount_column: OrderSum

  # Часовой пояс чеков
  timezone: Europe/Moscow


matching:
  # Допуск до начала визита: чек может быть на 0 секунд раньше появления у кассы
  window_before_seconds: 0

  # Допуск после окончания визита: чек может быть на 60 секунд позже ухода из зоны
  window_after_seconds: 60

  # Правило при нескольких подходящих посетителях: выбрать ближайшего и поставить флаг
  ambiguity_policy: closest_with_flag

  # Правило для групп: привязать всех людей рядом к чеку с флагом группы
  group_policy: attach_all_with_group_flag


reports:
  # Форматы итоговых отчетов
  formats:
    - csv
    - xlsx
